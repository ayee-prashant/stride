# Local development only. PostgreSQL 18 keeps its versioned data under this mount.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: stride_local
      POSTGRES_DB: stride_local
      POSTGRES_PASSWORD: ${STRIDE_LOCAL_DB_PASSWORD:?Use npm run setup:local}
    ports:
      - "127.0.0.1:${STRIDE_LOCAL_DB_PORT:?Use npm run setup:local}:5432"
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride_local -d stride_local"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"
volumes:
  data:
