name: Generate approved productivity dependencies and migration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/team-productivity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and pin the official S3 client
        run: npm install --save-exact @aws-sdk/client-s3@latest --no-audit --no-fund
      - run: npm run db:generate
      - name: Commit only approved generated files to this feature branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const allowed = /^(package\.json|package-lock\.json|drizzle-postgres\/(0002_[a-z0-9_]+\.sql|meta\/(0002_snapshot\.json|_journal\.json)))$/;
            const changed = [...new Set([
              ...cp.execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n'),
              ...cp.execFileSync('git', ['ls-files', '--others', '--exclude-standard'], { encoding: 'utf8' }).trim().split('\n'),
            ].filter(Boolean))];
            if (changed.some(path => !allowed.test(path))) throw new Error('Unexpected generated file');
            if (!changed.length) return;
            const {owner, repo} = context.repo;
            const head = context.payload.pull_request.head.sha;
            const branch = 'feature/team-productivity';
            const current = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            if (current.data.object.sha !== head) throw new Error('Feature branch advanced; retry on its next revision');
            const parent = await github.rest.git.getCommit({owner, repo, commit_sha: head});
            const tree = await github.rest.git.createTree({owner, repo, base_tree: parent.data.tree.sha,
              tree: changed.map(path => ({path, mode: '100644', type: 'blob', content: fs.readFileSync(path, 'utf8')}))});
            const commit = await github.rest.git.createCommit({owner, repo, parents: [head], tree: tree.data.sha, message: 'Generate additive productivity migration and pin S3 SDK'});
            await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false});
            core.info(`Generated commit: ${commit.data.sha}`);
