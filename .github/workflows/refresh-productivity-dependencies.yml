name: Refresh approved productivity dependency fixes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/team-productivity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve a fixed esbuild for the legacy Drizzle loader
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const version = JSON.parse(execFileSync('npm', ['view', 'esbuild', 'version', '--json'], {encoding:'utf8'}));
          if (!/^0\.(2[5-9]|[3-9][0-9])\.\d+$/.test(version)) throw new Error('Review this esbuild release before adopting it');
          const pkg = JSON.parse(readFileSync('package.json','utf8'));
          pkg.overrides = {'@esbuild-kit/core-utils': {esbuild: version}};
          writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          JS
      - run: npm install --no-audit --no-fund
      - run: npm update baseline-browser-mapping browserslist brace-expansion js-yaml @babel/core fflate --no-audit --no-fund
      - name: Commit only generated package files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs'); const cp = require('node:child_process');
            const changed = cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
            if(changed.some(path=>!['package.json','package-lock.json'].includes(path))) throw new Error('Unexpected changed file');
            if(!changed.length) return;
            const {owner,repo}=context.repo; const head=context.payload.pull_request.head.sha; const branch='feature/team-productivity';
            const current=await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`});
            if(current.data.object.sha!==head) throw new Error('Branch advanced; retry on the next revision');
            const parent=await github.rest.git.getCommit({owner,repo,commit_sha:head});
            const tree=await github.rest.git.createTree({owner,repo,base_tree:parent.data.tree.sha,tree:changed.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}))});
            const commit=await github.rest.git.createCommit({owner,repo,parents:[head],tree:tree.data.sha,message:'Refresh dependency security fixes after retiring the unused legacy host stack'});
            await github.rest.git.updateRef({owner,repo,ref:`heads/${branch}`,sha:commit.data.sha,force:false});
            core.info(`Generated dependency commit: ${commit.data.sha}`);
