name: Prepare additive collaboration migration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/first-sprint-collaboration'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Commit only the generated additive migration to this feature branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const paths = cp.execFileSync('git', ['ls-files', '--others', '--modified', '--exclude-standard', '--', 'drizzle-postgres'], {encoding: 'utf8'}).trim().split('\n').filter(Boolean);
            if (!paths.length) { core.info('Migration is already committed.'); return; }
            const allowed = /^drizzle-postgres\/(?:0001_[a-z0-9_]+\.sql|meta\/(?:0001_snapshot|_journal)\.json)$/;
            if (paths.some(path => !allowed.test(path))) throw new Error('Refusing unexpected migration changes.');
            const {owner, repo} = context.repo;
            const branch = context.payload.pull_request.head.ref;
            const head = context.payload.pull_request.head.sha;
            const current = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            if (current.data.object.sha !== head) throw new Error('Feature branch advanced; rerun on its new head.');
            const source = await github.rest.git.getCommit({owner, repo, commit_sha: head});
            const tree = await github.rest.git.createTree({owner, repo, base_tree: source.data.tree.sha,
              tree: paths.map(path => ({path, mode: '100644', type: 'blob', content: fs.readFileSync(path, 'utf8')}))});
            const commit = await github.rest.git.createCommit({owner, repo, message: 'Generate additive collaboration migration with pinned Drizzle', tree: tree.data.sha, parents: [head]});
            await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false});
            core.info(`Generated migration committed at ${commit.data.sha}. Run the full gate on that source before deployment.`);
