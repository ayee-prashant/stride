name: Verify hosting migration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: stride_test
          POSTGRES_PASSWORD: isolated_ci_fixture
          POSTGRES_DB: stride_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One-time migration bootstrap. The resulting lockfile must be reviewed
      # and committed before this changes to npm ci and production is released.
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - uses: actions/upload-artifact@v4
        with:
          name: migration-source-${{ github.event.pull_request.head.sha }}
          path: |
            package-lock.json
            drizzle-postgres/
          retention-days: 7
      - run: npm test
      - run: npm run test:postgres
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://stride_test:isolated_ci_fixture@127.0.0.1:5432/stride_test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
